name: Build ExtendCast for Windows

on:
  push:
    paths:
      - 'Desktop/**'
      - '.github/workflows/build-windows-receiver.yml'
  workflow_dispatch:  # Manual trigger from GitHub UI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  QT_VERSION: '6.7.0'
  WINDOWS_BUILD_DIR: 'D:/Temp/ExtendCast/windows-build'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content "Desktop/VERSION" -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "VERSION must contain semantic version X.Y.Z, got '$version'"
            exit 1
          }
          Write-Host "Building ExtendCast $version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt 6 via aqtinstall
        shell: pwsh
        run: |
          pip install aqtinstall
          python -m aqt install-qt windows desktop ${{ env.QT_VERSION }} win64_msvc2019_64 `
            --modules qtmultimedia `
            --outputdir C:/Qt
          echo "Qt6_DIR=C:/Qt/${{ env.QT_VERSION }}/msvc2019_64" >> $env:GITHUB_ENV
          echo "C:/Qt/${{ env.QT_VERSION }}/msvc2019_64/bin" >> $env:GITHUB_PATH

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: |
            C:/vcpkg/installed
            C:/vcpkg/buildtrees
            C:/vcpkg/packages
          key: vcpkg-ffmpeg-x64-windows-${{ hashFiles('.github/workflows/build-windows-receiver.yml') }}
          restore-keys: |
            vcpkg-ffmpeg-x64-windows-

      - name: Install FFmpeg via vcpkg (with x264 encoder)
        shell: pwsh
        run: |
          vcpkg install "ffmpeg[x264]:x64-windows" --recurse
        env:
          VCPKG_ROOT: C:/vcpkg

      - name: Configure CMake
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:WINDOWS_BUILD_DIR" | Out-Null
          cmake -S "${{ github.workspace }}/Desktop" -B "$env:WINDOWS_BUILD_DIR" `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_PREFIX_PATH="$env:Qt6_DIR"

      - name: Build
        shell: pwsh
        run: |
          cmake --build "$env:WINDOWS_BUILD_DIR" --config Release

      - name: Install NSIS
        shell: pwsh
        run: |
          # Use portable NSIS ZIP (no installer needed)
          $nsisVersion = "3.10"
          $nsisUrl = "https://github.com/nicehash/NSIS/releases/download/v${nsisVersion}/nsis-${nsisVersion}.zip"
          try {
            Invoke-WebRequest -Uri $nsisUrl -OutFile "nsis.zip"
          } catch {
            Write-Host "GitHub download failed, trying winget..."
            winget install NSIS.NSIS --accept-source-agreements --accept-package-agreements --silent
          }

          if (Test-Path "nsis.zip") {
            Expand-Archive -Path "nsis.zip" -DestinationPath "C:/nsis"
            $nsisDir = Get-ChildItem "C:/nsis" -Directory | Select-Object -First 1
            if ($nsisDir) {
              echo "$($nsisDir.FullName)" >> $env:GITHUB_PATH
              Write-Host "NSIS portable extracted to $($nsisDir.FullName)"
            } else {
              echo "C:/nsis" >> $env:GITHUB_PATH
            }
          } else {
            echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH
          }

      - name: Package portable + installer
        shell: pwsh
        run: |
          # Single packaging entry point — always bundles VC++ CRT + vc_redist.x64.exe
          & "${{ github.workspace }}/Desktop/package-windows.ps1" `
            -BuildDir "$env:WINDOWS_BUILD_DIR" `
            -OutDir "${{ github.workspace }}/artifact" `
            -QtBin "$env:Qt6_DIR/bin" `
            -Installer `
            -InstallerOut "${{ github.workspace }}/ExtendCast-Setup-${{ steps.version.outputs.version }}.exe"

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExtendCast-Windows-x64
          path: artifact/
          retention-days: 30

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ExtendCast-Setup-Windows-x64
          path: ExtendCast-Setup-*.exe
          retention-days: 30
