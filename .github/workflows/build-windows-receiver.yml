name: Build ExtendCast for Windows

on:
  push:
    paths:
      - 'Desktop/**'
      - '.github/workflows/build-windows-receiver.yml'
  workflow_dispatch:  # Manual trigger from GitHub UI

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  QT_VERSION: '6.7.0'
  WINDOWS_BUILD_DIR: 'D:/Temp/ExtendCast/windows-build'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content "Desktop/VERSION" -Raw).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            Write-Error "VERSION must contain semantic version X.Y.Z, got '$version'"
            exit 1
          }
          Write-Host "Building ExtendCast $version"
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt 6 via aqtinstall
        shell: pwsh
        run: |
          pip install aqtinstall
          python -m aqt install-qt windows desktop ${{ env.QT_VERSION }} win64_msvc2019_64 `
            --modules qtmultimedia `
            --outputdir C:/Qt
          echo "Qt6_DIR=C:/Qt/${{ env.QT_VERSION }}/msvc2019_64" >> $env:GITHUB_ENV
          echo "C:/Qt/${{ env.QT_VERSION }}/msvc2019_64/bin" >> $env:GITHUB_PATH

      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: |
            C:/vcpkg/installed
            C:/vcpkg/buildtrees
            C:/vcpkg/packages
          key: vcpkg-ffmpeg-x64-windows-${{ hashFiles('.github/workflows/build-windows-receiver.yml') }}
          restore-keys: |
            vcpkg-ffmpeg-x64-windows-

      - name: Install FFmpeg via vcpkg (with x264 encoder)
        shell: pwsh
        run: |
          vcpkg install "ffmpeg[x264]:x64-windows" --recurse
        env:
          VCPKG_ROOT: C:/vcpkg

      - name: Configure CMake
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:WINDOWS_BUILD_DIR" | Out-Null
          cmake -S "${{ github.workspace }}/Desktop" -B "$env:WINDOWS_BUILD_DIR" `
            -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="C:/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_PREFIX_PATH="$env:Qt6_DIR"

      - name: Build
        shell: pwsh
        run: |
          cmake --build "$env:WINDOWS_BUILD_DIR" --config Release

      - name: Package artifact
        shell: pwsh
        run: |
          mkdir artifact

          # Copy the exe
          Copy-Item "$env:WINDOWS_BUILD_DIR/Release/ExtendCast.exe" "artifact/"

          # Run windeployqt to bundle Qt DLLs
          windeployqt --release --no-translations --no-system-d3d-compiler `
            --no-opengl-sw "artifact/ExtendCast.exe"

          # Copy FFmpeg DLLs used by the receiver.
          Get-ChildItem "$env:WINDOWS_BUILD_DIR/Release/*.dll" | ForEach-Object {
            Copy-Item $_.FullName "artifact/"
          }

          # Qt's media plugin brings an unrelated FFmpeg runtime. Receiver audio
          # uses QAudioSink directly, so keep the smaller receiver-only payload.
          $unused = @(
            "artifact/multimedia/ffmpegmediaplugin.dll",
            "artifact/avcodec-60.dll",
            "artifact/avformat-60.dll",
            "artifact/avutil-58.dll",
            "artifact/swresample-4.dll",
            "artifact/swscale-7.dll"
          )
          foreach ($path in $unused) {
            Remove-Item $path -Force -ErrorAction SilentlyContinue
          }

          # Copy app icon for runtime (embedded via Qt resource, but also keep as fallback)
          Copy-Item "Desktop/appicon.ico" "artifact/" -ErrorAction SilentlyContinue

      - name: Install NSIS
        shell: pwsh
        run: |
          # Use portable NSIS ZIP from nsis.sourceforge.io (no installer needed)
          $nsisVersion = "3.10"
          $nsisUrl = "https://github.com/nicehash/NSIS/releases/download/v${nsisVersion}/nsis-${nsisVersion}.zip"
          try {
            Invoke-WebRequest -Uri $nsisUrl -OutFile "nsis.zip"
          } catch {
            # Fallback: try winget
            Write-Host "GitHub download failed, trying winget..."
            winget install NSIS.NSIS --accept-source-agreements --accept-package-agreements --silent
          }

          if (Test-Path "nsis.zip") {
            Expand-Archive -Path "nsis.zip" -DestinationPath "C:/nsis"
            # Find the extracted folder (may be nsis-3.10/)
            $nsisDir = Get-ChildItem "C:/nsis" -Directory | Select-Object -First 1
            if ($nsisDir) {
              echo "$($nsisDir.FullName)" >> $env:GITHUB_PATH
              Write-Host "NSIS portable extracted to $($nsisDir.FullName)"
            } else {
              echo "C:/nsis" >> $env:GITHUB_PATH
            }
          } else {
            echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH
          }

      - name: Build installer
        shell: pwsh
        run: |
          cd Desktop

          # Copy artifact next to installer.nsi
          # (NSIS references files relative to the .nsi script)
          Copy-Item -Recurse "${{ github.workspace }}/artifact" "artifact"

          # Build the installer
          makensis /INPUTCHARSET UTF8 /DPRODUCT_VERSION="${{ steps.version.outputs.version }}" installer.nsi

          # Move installer to workspace root
          Move-Item "ExtendCast-Setup-*.exe" "${{ github.workspace }}/"

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExtendCast-Windows-x64
          path: artifact/
          retention-days: 30

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ExtendCast-Setup-Windows-x64
          path: ExtendCast-Setup-*.exe
          retention-days: 30
