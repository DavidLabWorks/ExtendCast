<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="extension" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fc2ff"/>
      <stop offset="0.42" stop-color="#3b91ff"/>
      <stop offset="1" stop-color="#0869f5"/>
    </linearGradient>
    <radialGradient id="glow" cx="68%" cy="43%" r="45%">
      <stop offset="0" stop-color="#1677ff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#1677ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="ambientShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#000" flood-opacity="0.58"/>
    </filter>
    <filter id="markShadow" x="-30%" y="-40%" width="170%" height="190%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.56"/>
    </filter>
  </defs>

  <!-- The enclosure remains restrained so the display mark owns the icon. -->
  <rect x="64" y="64" width="896" height="896" rx="214"
        fill="#07080a" filter="url(#ambientShadow)"/>
  <rect x="65" y="65" width="894" height="894" rx="213"
        fill="none" stroke="#fff" stroke-opacity="0.09" stroke-width="2"/>
  <rect x="64" y="64" width="896" height="896" rx="214" fill="url(#glow)"/>

  <!-- The blue extension boundary is centered on the icon canvas. -->
  <rect x="236" y="260" width="552" height="504" rx="88"
        fill="#07080a" stroke="url(#extension)" stroke-width="46"
        filter="url(#markShadow)"/>

  <!-- The white source display is optically and mathematically centered inside it. -->
  <rect x="315" y="350" width="394" height="324" rx="64"
        fill="#07080a" stroke="#f8fafc" stroke-width="44"
        filter="url(#markShadow)"/>

  <!-- The extension action sits inside the display instead of breaking its frame. -->
  <path d="M426 480 H536 V442 L622 512 L536 582 V544 H426 Z"
        fill="url(#extension)"/>
</svg>
